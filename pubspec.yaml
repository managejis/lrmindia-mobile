name: abba_sunday_school
description: ABBA Sunday School - Bible lessons and songs for children (Hindi, Kannada), readable offline.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.0
  shared_preferences: ^2.3.3
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  http: ^1.6.0
  path_provider: ^2.1.6
  media_store_plus: ^0.1.3
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/app_logo.png
    - assets/grn.jpg
